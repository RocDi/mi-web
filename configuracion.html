<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="header"></div>

  <main>
    <section>
      <h1>Configuración</h1>

      <div class="ajuste">
        <h2>Aspecto</h2>
        <div class="opciones-tema">
          <label><input type="radio" name="tema" value="claro"> Claro</label>
          <label><input type="radio" name="tema" value="oscuro"> Oscuro</label>
          <label><input type="radio" name="tema" value="sistema"> Predeterminado del dispositivo</label>
        </div>
      </div>
            <form id="form-nombre" class="ajuste">
        <h2>Nombre</h2>
        <label>Nombre
          <input type="text" id="nombre" maxlength="50" required>
        </label>
        <label>Apellidos
          <input type="text" id="apellidos" maxlength="80" required>
        </label>
        <button type="submit" class="boton">Guardar nombre</button>
        <p id="mensaje-nombre"></p>
      </form>
            <form id="form-correo" class="ajuste">
        <h2>Correo</h2>
        <p>Correo actual: <strong id="correo-actual"></strong></p>
        <label>Nuevo correo
          <input type="email" id="correo-nuevo" required>
        </label>
        <button type="submit" class="boton">Cambiar correo</button>
        <p id="mensaje-correo"></p>
      </form>
            <form id="form-clave" class="ajuste">
        <h2>Contraseña</h2>
        <label>Contraseña actual
          <input type="password" id="clave-actual" autocomplete="current-password" required>
        </label>
        <label>Nueva contraseña (mínimo 8 caracteres)
          <input type="password" id="clave-nueva" minlength="8" autocomplete="new-password" required>
        </label>
        <label>Repite la nueva contraseña
          <input type="password" id="clave-nueva2" minlength="8" autocomplete="new-password" required>
        </label>
        <button type="submit" class="boton">Cambiar contraseña</button>
        <p id="mensaje-clave"></p>
      </form>
            <div id="bloque-mfa" class="ajuste">
        <h2>Verificación en dos pasos</h2>
        <p id="estado-mfa"></p>
        <button type="button" class="boton" id="btn-mfa-activar">Activar</button>

        <div id="zona-mfa" hidden>
          <p>1. Escanea este código con tu app de autenticación.</p>
          <img id="qr-mfa" alt="Código QR para la app de autenticación" width="200" height="200">
          <p>Si no puedes escanearlo, escribe esta clave en la app: <code id="clave-mfa"></code></p>
          <form id="form-mfa-verificar">
            <label>2. Escribe el código de 6 dígitos que muestra la app
              <input type="text" id="codigo-mfa" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
            </label>
            <button type="submit" class="boton">Confirmar y activar</button>
          </form>
        </div>

        <button type="button" class="boton-peligro" id="btn-mfa-quitar" hidden>Desactivar</button>
        <p id="mensaje-mfa"></p>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/main.js"></script>
  <script src="js/configuracion.js"></script>
</body>
</html>
